evaluation:
  optimal_threshold: 0.6099999999999998
features:
  categorical:
  - PreferredLoginDevice
  - PreferredPaymentMode
  - Gender
  - PreferedOrderCat
  - MaritalStatus
  - SubscriptionPlan
  drop:
  - CustomerID
  target: Churn
paths:
  data: data/ecommerce_churn_enhanced.csv
  encoders: models/encoders.pkl
  model_json: models/xgboost_churn.json
  model_pkl: models/xgboost_churn.pkl
  plots_dir: outputs/plots
  report: outputs/comparison_report.md
xgboost:
  colsample_bytree: 1.0
  eval_metric: auc
  gamma: 1
  learning_rate: 0.1
  max_depth: 5
  min_child_weight: 7
  n_estimators: 300
  n_jobs: -1
  random_state: 42
  reg_alpha: 0.1
  reg_lambda: 1.0
  scale_pos_weight: auto
  subsample: 0.7
  use_label_encoder: false
